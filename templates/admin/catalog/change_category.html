{% extends "admin/base_site.html" %}
{% load i18n %}

{% block content %}
<div id="content-main" class="max-w-xl">
  <h1 class="text-xl font-semibold mb-4">Змінити категорію</h1>
  <p class="mb-4 text-font-subtle-light dark:text-font-subtle-dark">
    Обрано товарів: {{ queryset.count }}
  </p>

  <form method="post">
    {% csrf_token %}
    <input type="hidden" name="action" value="change_category">
    <input type="hidden" name="apply" value="1">
    {% for obj in queryset %}
      <input type="hidden" name="{{ action_checkbox_name }}" value="{{ obj.pk }}">
    {% endfor %}

    <label class="block font-medium mb-2" for="id_category">Нова категорія</label>
    <select name="category" id="id_category" required class="border border-base-200 rounded-default px-3 py-2 w-full mb-6 dark:bg-base-900 dark:border-base-700">
      <option value="">— оберіть —</option>
      {% for cat in categories %}
        <option value="{{ cat.pk }}">{{ cat.name }}</option>
      {% endfor %}
    </select>

    <div class="flex flex-wrap gap-3">
      <button type="submit" class="bg-primary-600 text-white rounded-default px-4 py-2 font-medium">
        Застосувати
      </button>
      <a href="{% url 'admin:catalog_product_changelist' %}" class="border border-base-200 rounded-default px-4 py-2 font-medium dark:border-base-700">
        Скасувати
      </a>
    </div>
  </form>
</div>
{% endblock %}
