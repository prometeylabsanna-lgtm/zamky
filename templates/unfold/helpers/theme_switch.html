{% load i18n %}

{% if not theme %}
    <div class="zamky-theme-switch border-b border-base-200 dark:border-base-700">
        <a class="zamky-theme-switch__btn"
           x-on:click="switchTheme('light')"
           x-bind:class="adminTheme == 'light' && 'is-active'">
            <span class="material-symbols-outlined">light_mode</span>
            <span class="zamky-theme-switch__label">Світла</span>
        </a>

        <a class="zamky-theme-switch__btn"
           x-on:click="switchTheme('dark')"
           x-bind:class="adminTheme == 'dark' && 'is-active'">
            <span class="material-symbols-outlined">dark_mode</span>
            <span class="zamky-theme-switch__label">Темна</span>
        </a>

        <a class="zamky-theme-switch__btn"
           x-on:click="switchTheme('auto')"
           x-bind:class="adminTheme == 'auto' && 'is-active'">
            <span class="material-symbols-outlined">computer</span>
            <span class="zamky-theme-switch__label">Системна</span>
        </a>
    </div>
{% endif %}
