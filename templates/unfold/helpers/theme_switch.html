{% load i18n %}

{% if not theme %}
    <div class="zamky-theme-switch border-b border-base-200 flex flex-row gap-1 mb-1 pb-1 px-2 dark:border-base-700">
        <a class="zamky-theme-switch__btn cursor-pointer flex flex-row items-center gap-1.5 grow px-2 py-1.5 rounded-default hover:bg-base-100 hover:text-base-700 dark:hover:bg-base-700 dark:hover:text-base-200"
           x-on:click="switchTheme('light')"
           x-bind:class="adminTheme == 'light' && 'text-primary-600 dark:text-primary-500'">
            <span class="material-symbols-outlined text-[18px]">light_mode</span>
            <span class="zamky-theme-switch__label">Світла</span>
        </a>

        <a class="zamky-theme-switch__btn cursor-pointer flex flex-row items-center gap-1.5 grow px-2 py-1.5 rounded-default hover:bg-base-100 hover:text-base-700 dark:hover:bg-base-700 dark:hover:text-base-200"
           x-on:click="switchTheme('dark')"
           x-bind:class="adminTheme == 'dark' && 'text-primary-600 dark:text-primary-500'">
            <span class="material-symbols-outlined text-[18px]">dark_mode</span>
            <span class="zamky-theme-switch__label">Темна</span>
        </a>

        <a class="zamky-theme-switch__btn cursor-pointer flex flex-row items-center gap-1.5 grow px-2 py-1.5 rounded-default hover:bg-base-100 hover:text-base-700 dark:hover:bg-base-700 dark:hover:text-base-200"
           x-on:click="switchTheme('auto')"
           x-bind:class="adminTheme == 'auto' && 'text-primary-600 dark:text-primary-500'">
            <span class="material-symbols-outlined text-[18px]">computer</span>
            <span class="zamky-theme-switch__label">Системна</span>
        </a>
    </div>
{% endif %}
