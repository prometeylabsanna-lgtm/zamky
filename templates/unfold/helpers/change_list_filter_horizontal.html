{% load unfold unfold_list %}

{% with horizontal_filters=cl|unfold_horizontal_filters %}
    {% if horizontal_filters|length > 0 %}
        <form method="get" class="zamky-filters-row" oninput="this.submit()">
            {% preserve_filters "horizontal" %}

            {% for spec in horizontal_filters %}
                <div class="zamky-filter">
                    {% unfold_admin_list_filter cl spec True %}
                </div>
            {% endfor %}
        </form>
    {% endif %}
{% endwith %}
