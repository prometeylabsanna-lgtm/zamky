<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<footer id="footer" style="background: #101010; color: #fff; font-family: 'Inter', sans-serif;">
  <div style="max-width: 1440px; margin: 0 auto; box-sizing: border-box; padding: 64px clamp(16px, 2vw, 28px) 56px;">
    <div style="display: grid; grid-template-columns: {{ footCols }}; gap: {{ footGap }};">
      <a href="Home.dc.html" style="font-size: 32px; font-weight: 800; letter-spacing: -0.03em; line-height: 1; color: #fff; grid-column: {{ logoSpan }};">Logo</a>
      <nav style="display: flex; flex-direction: column; font-size: 16px; line-height: 32px; margin-top: -9px;">
        <a href="Info.dc.html#about" style="color: #fff;">Про компанію</a>
        <a href="Info.dc.html#contacts" style="color: #fff;">Контакти</a>
        <a href="Info.dc.html#about" style="color: #fff;">Інформація про торгову точку</a>
      </nav>
      <nav style="display: flex; flex-direction: column; font-size: 16px; line-height: 32px; margin-top: -9px;">
        <a href="Info.dc.html#delivery" style="color: #fff;">Обмін та повернення</a>
        <a href="Info.dc.html#delivery" style="color: #fff;">Доставка</a>
        <a href="Info.dc.html#delivery" style="color: #fff;">Оплата</a>
        <a href="Info.dc.html#privacy" style="color: #fff;">Політика конфіденційності</a>
        <a href="Info.dc.html#offer" style="color: #fff;">Договір оферти</a>
      </nav>
      <nav style="display: flex; flex-direction: column; font-size: 16px; line-height: 32px; margin-top: -9px;">
        <a href="Info.dc.html#contacts" style="color: #fff;">Консультація</a>
        <a href="Info.dc.html#contacts" style="color: #fff;">Підбір</a>
        <a href="Info.dc.html#contacts" style="color: #fff;">Монтаж</a>
      </nav>
      <div style="display: flex; flex-direction: column; font-size: 16px; line-height: 32px; margin-top: -9px;">
        <a href="tel:0670000000" style="color: #ffc400;">067 00 00 00</a>
        <a href="tel:0660000000" style="color: #ffc400;">066 00 00 00</a>
        <a href="mailto:xxx@gmail.com" style="color: #ffc400;">xxx@gmail.com</a>
      </div>
    </div>
    <div style="margin-top: 16px; height: 1px; background: #3a3a3a;"></div>
    <p style="margin: 20px 0 0; font-size: 11px; line-height: 1.2; color: #bdbdbd;">Name Всі права захищено, копіювання матеріалів заборонено</p>
  </div>
</footer>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:&quot;100%&quot;,&quot;height&quot;:320}}">
class Component extends DCLogic {
  state = { w: typeof window !== 'undefined' ? window.innerWidth : 1440 };
  componentDidMount() { this.r = () => this.setState({ w: window.innerWidth }); window.addEventListener('resize', this.r); }
  componentWillUnmount() { window.removeEventListener('resize', this.r); }
  renderVals() {
    const w = this.state.w, d = w >= 1100, t = w >= 720 && w < 1100;
    return {
      footCols: d ? 'minmax(0,327fr) minmax(0,370fr) minmax(0,340fr) minmax(0,217fr) auto' : t ? 'repeat(4, minmax(0, 1fr))' : 'repeat(2, minmax(0, 1fr))',
      footGap: d ? '0' : '32px 20px',
      logoSpan: d ? 'auto' : '1 / -1',
    };
  }
}
</script>
</body>
</html>
